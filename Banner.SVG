</g>
<circle r="9" fill="#ffc933" stroke="#15120f" stroke-width="2"><animateMotion dur="6s" repeatCount="indefinite" path="M -150 10 A 150 44 0 1 1 150 10 A 150 44 0 1 1 -150 10"/></circle>
