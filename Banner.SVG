<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="MediCare Hospital Management System banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.f{animation:float 3.6s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(.88);opacity:.12}}
</style>
<defs><pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#15120f" opacity=".16"/></pattern></defs>
<rect x="10" y="10" width="886" height="286" fill="#15120f"/>
<rect x="4" y="4" width="886" height="286" fill="#f2ede2" stroke="#15120f" stroke-width="4"/>
<rect x="4" y="4" width="886" height="286" fill="url(#d)"/>
<text x="40" y="118" font-family="Arial Black,Impact,Arial,sans-serif" font-size="66" fill="#15120f">MediCare<tspan fill="#e2362b">.</tspan></text>
<text x="42" y="152" font-family="Courier New,Courier,monospace" font-size="14" letter-spacing="2.5" fill="#6b645a">HOSPITAL MANAGEMENT SYSTEM / PYTHON OOP</text>
<rect x="43" y="193" width="124" height="30" fill="#15120f"/><rect x="40" y="190" width="124" height="30" fill="#fffdf7" stroke="#15120f" stroke-width="2"/><text x="102.0" y="210" text-anchor="middle" font-family="Courier New,Courier,monospace" font-size="12" font-weight="bold" fill="#15120f">Encapsulation</text>
<rect x="181" y="193" width="108" height="30" fill="#15120f"/><rect x="178" y="190" width="108" height="30" fill="#fffdf7" stroke="#15120f" stroke-width="2"/><text x="232.0" y="210" text-anchor="middle" font-family="Courier New,Courier,monospace" font-size="12" font-weight="bold" fill="#15120f">Inheritance</text>
<rect x="303" y="193" width="116" height="30" fill="#15120f"/><rect x="300" y="190" width="116" height="30" fill="#fffdf7" stroke="#15120f" stroke-width="2"/><text x="358.0" y="210" text-anchor="middle" font-family="Courier New,Courier,monospace" font-size="12" font-weight="bold" fill="#15120f">Polymorphism</text>
<rect x="433" y="193" width="108" height="30" fill="#15120f"/><rect x="430" y="190" width="108" height="30" fill="#fffdf7" stroke="#15120f" stroke-width="2"/><text x="484.0" y="210" text-anchor="middle" font-family="Courier New,Courier,monospace" font-size="12" font-weight="bold" fill="#15120f">Abstraction</text>
<text x="42" y="256" font-family="Courier New,Courier,monospace" font-size="12" letter-spacing="1" fill="#6b645a">PATIENTS · DOCTORS · APPOINTMENTS · EMPLOYEES · BILLING</text>
<g transform="translate(715,160)">
<ellipse cx="0" cy="10" rx="150" ry="44" fill="none" stroke="#15120f" stroke-width="2" stroke-dasharray="6 6"/>
<ellipse class="sh" cx="0" cy="54" rx="80" ry="14" fill="#15120f" opacity=".25"/>
<g class="f" stroke="#15120f" stroke-width="2.5" stroke-linejoin="round">
<polygon points="76.2,-22.0 38.1,0.0 38.1,-33.0 76.2,-55.0" fill="#b82419"/>
<polygon points="-38.1,0.0 -76.2,-22.0 -76.2,-55.0 -38.1,-33.0" fill="#d6342a"/>
